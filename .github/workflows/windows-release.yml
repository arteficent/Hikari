name: Windows Release

# Builds the Hikari Windows client as a standalone, self-contained .exe for x86
# and x64, optionally Authenticode-signs it, and attaches it to the GitHub Release.
#
# Trigger by pushing a version tag (the same tag also drives android-release.yml,
# so both clients land on one release):
#   git tag v1.2.3 && git push origin v1.2.3
#
# Signing is opt-in. When WINDOWS_CERT_PFX_BASE64 is present the exe is signed
# and timestamped; otherwise the job still succeeds and publishes UNSIGNED exes
# (they run, but SmartScreen will warn).
#
# Optional secrets:
#   WINDOWS_CERT_PFX_BASE64   base64 of the code-signing .pfx
#                             ([Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx')))
#   WINDOWS_CERT_PASSWORD     password of the .pfx
# Optional repository variable:
#   WINDOWS_TIMESTAMP_URL     RFC 3161 timestamp server (default: DigiCert)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3 (no leading "v")'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: windows-client/src/Hikari.WindowsClient/Hikari.WindowsClient.csproj
  TEST_PROJECT: windows-client/tests/Hikari.WindowsClient.Tests/Hikari.WindowsClient.Tests.csproj

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      file: ${{ steps.version.outputs.file }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Version comes from the tag. Windows file versions must be purely numeric
      # (a.b.c.d), so a pre-release suffix is kept only in the product version.
      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$version' is not MAJOR.MINOR.PATCH[-SUFFIX] (from '$RAW_VERSION')."
            exit 1
          fi
          core="${version%%-*}"
          for part in ${core//./ }; do
            # Each file-version field is a 16-bit integer.
            if [ "$((10#$part))" -gt 65534 ]; then
              echo "::error::Version part '$part' exceeds 65534, the Windows file-version limit."
              exit 1
            fi
          done
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "file=$core.0" >> "$GITHUB_OUTPUT"
          if [ "$core" != "$version" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows-client/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Integration tests talk to the hosted server; a release must not depend on its uptime.
      - name: Run tests
        run: dotnet test "${{ env.TEST_PROJECT }}" -c Release --filter "Category!=Integration" --logger "console;verbosity=normal"

  build:
    name: Build ${{ matrix.arch }}
    needs: [version, test]
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x86, x64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows-client/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish standalone exe
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          FILE_VERSION: ${{ needs.version.outputs.file }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "publish-${{ matrix.arch }}"
          dotnet publish $env:PROJECT `
            -p:PublishProfile=Standalone `
            -r "win-${{ matrix.arch }}" `
            -o $out `
            "-p:Version=$env:VERSION_NAME" `
            "-p:FileVersion=$env:FILE_VERSION" `
            "-p:AssemblyVersion=$env:FILE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

          $exe = Join-Path $out 'Hikari.WindowsClient.exe'
          if (-not (Test-Path $exe)) { throw "Publish did not produce $exe" }
          "PUBLISH_DIR=$out" >> $env:GITHUB_ENV

      - name: Decode signing certificate
        id: signing
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::WINDOWS_CERT_PFX_BASE64 is not set - publishing an UNSIGNED exe."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'hikari-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "enabled=true" >> $env:GITHUB_OUTPUT
          "path=$pfx" >> $env:GITHUB_OUTPUT

      - name: Sign exe
        if: steps.signing.outputs.enabled == 'true'
        env:
          PFX_PATH: ${{ steps.signing.outputs.path }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK.' }

          $exe = Join-Path $env:PUBLISH_DIR 'Hikari.WindowsClient.exe'

          # Timestamp servers are occasionally flaky; a missing timestamp would make the
          # signature expire with the certificate, so retry rather than skip it.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & $signtool.FullName sign /fd SHA256 /f $env:PFX_PATH /p $env:PFX_PASSWORD `
              /tr $env:TIMESTAMP_URL /td SHA256 /d 'Hikari' $exe
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw 'signtool sign failed after 3 attempts.' }
            Start-Sleep -Seconds (10 * $attempt)
          }

          # Chain trust can't be asserted for self-signed or private CAs on the runner, so
          # check the exe carries a signature from exactly the certificate we were given.
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $env:PFX_PATH, $env:PFX_PASSWORD)
          $signature = Get-AuthenticodeSignature $exe
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "Signature check failed: $($signature.Status) $($signature.StatusMessage)"
          }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'The signature is not timestamped.' }
          Write-Output "Signed by $($cert.Subject) (status: $($signature.Status))"

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.path != ''
        env:
          PFX_PATH: ${{ steps.signing.outputs.path }}
        run: Remove-Item -LiteralPath $env:PFX_PATH -Force -ErrorAction SilentlyContinue

      # Hosted runners have a desktop session, but a GUI launch there is best-effort,
      # so a failure is reported without blocking the release.
      - name: Smoke test
        continue-on-error: true
        run: |
          $exe = Join-Path $env:PUBLISH_DIR 'Hikari.WindowsClient.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "The app exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          Write-Output "The app started and stayed up."

      - name: Collect artifact
        id: artifact
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          $suffix = if ($env:SIGNED -eq 'true') { '' } else { '-unsigned' }
          $name = "hikari-windows-$env:VERSION_NAME-${{ matrix.arch }}$suffix.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Join-Path $env:PUBLISH_DIR 'Hikari.WindowsClient.exe') "dist/$name"
          Copy-Item (Join-Path $env:PUBLISH_DIR 'Hikari.WindowsClient.pdb') "dist/$name.pdb" -ErrorAction SilentlyContinue
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true

      # Symbols stay in the workflow artifacts; the release only carries what users run.
      - name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.exe > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      # android-release.yml runs off the same tag, so the release may already exist
      # (or be created by it a moment later). Create if absent, otherwise just upload.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.name }}
          PRERELEASE: ${{ inputs.prerelease || needs.version.outputs.prerelease == 'true' }}
        run: |
          set -euo pipefail
          files=(dist/*.exe dist/SHA256SUMS-windows.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--title "Hikari $TAG" --target "${{ github.sha }}" --generate-notes)
            if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); fi
            if gh release create "$TAG" "${flags[@]}" "${files[@]}"; then
              exit 0
            fi
            echo "::notice::Release $TAG appeared concurrently; uploading assets to it instead."
            sleep 5
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
