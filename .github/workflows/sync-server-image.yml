name: Sync Server Image

# Builds sync-server/Dockerfile and pushes it to Docker Hub as
# arteficent/hikari-sync-server.
#
# Tags produced:
#   push to main   -> latest, sha-<short-sha>
#   push tag v1.2.3 -> 1.2.3, 1.2
#   manual run     -> the tag supplied as input
#
# Required secrets:
#   DOCKERHUB_USERNAME  Docker Hub account (or org) name
#   DOCKERHUB_TOKEN     Docker Hub access token with Read/Write scope

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to push, e.g. 1.2.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-server-image-${{ github.ref }}
  # Every push to main must produce an image, so an in-flight build is never
  # cancelled by the next push.
  cancel-in-progress: false

env:
  IMAGE_NAME: arteficent/hikari-sync-server

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=false disables the implicit "latest" that semver tags would
          # otherwise add; latest must track main, not whichever tag ran last.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Hikari Sync Server
            org.opencontainers.image.description=Backend sync-server for Hikari

      # The Dockerfile COPYs src/ relative to its context, so the context must be
      # the sync-server directory rather than the repository root.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sync-server
          file: ./sync-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise pushed tags
        run: |
          {
            echo "### Pushed \`${IMAGE_NAME}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
