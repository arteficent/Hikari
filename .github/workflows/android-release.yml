name: Android Release

# Builds the Hikari Android client and publishes the APK as a GitHub Release.
#
# Trigger by pushing a version tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Signing is opt-in. When the ANDROID_KEYSTORE_BASE64 secret is present the APK
# is signed with it; otherwise the job still succeeds and publishes an UNSIGNED
# APK (installable with `adb install`, but not distributable through stores).
#
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks  (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.3 (no leading "v")'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # versionName comes from the tag; versionCode is derived from its numeric
      # core so it increases monotonically with the release and is reproducible.
      # A pre-release suffix (1.2.3-beta1) is kept in the name and flags the
      # GitHub Release as a pre-release.
      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$version' is not MAJOR.MINOR.PATCH[-SUFFIX] (from '$RAW_VERSION')."
            exit 1
          fi
          core="${version%%-*}"
          suffix=''
          if [ "$core" != "$version" ]; then
            suffix="${version#*-}"
          fi
          # 10# forces base 10: a zero-padded part such as 08 is otherwise read
          # as octal and aborts the arithmetic.
          major=$((10#${core%%.*}))
          rest="${core#*.}"
          minor=$((10#${rest%%.*}))
          patch=$((10#${rest#*.}))
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::minor and patch must each be <= 99 to fit the versionCode scheme."
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          # Android rejects a versionCode of 0 or above 2100000000.
          if [ "$code" -lt 1 ] || [ "$code" -gt 2100000000 ]; then
            echo "::error::Computed versionCode $code is outside the range Android accepts (1..2100000000)."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "$suffix" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - publishing an UNSIGNED APK."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hikari-release.jks"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android-client
        env:
          HIKARI_KEYSTORE_PATH: ${{ steps.signing.outputs.enabled == 'true' && format('{0}/hikari-release.jks', runner.temp) || '' }}
          HIKARI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HIKARI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HIKARI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            "-PhikariVersionName=${{ steps.version.outputs.name }}" \
            "-PhikariVersionCode=${{ steps.version.outputs.code }}" \
            --stacktrace

      # AGP names the output app-release.apk when signed and
      # app-release-unsigned.apk when not, so resolve it rather than assume.
      - name: Collect APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          src="$(find android-client/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$src" ]; then
            echo "::error::No APK produced by assembleRelease."
            exit 1
          fi
          suffix=''
          if [ "$SIGNED" != 'true' ]; then
            suffix='-unsigned'
          fi
          out="hikari-${VERSION_NAME}${suffix}.apk"
          mkdir -p dist
          cp "$src" "dist/$out"
          echo "path=dist/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: steps.signing.outputs.enabled == 'true'
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -r | head -n1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found in the SDK - skipping signature verification."
            exit 0
          fi
          "$apksigner" verify --print-certs "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          # Manual runs create the tag, so pin it to the commit that was built
          # rather than letting GitHub default it to the head of the default branch.
          target_commitish: ${{ github.sha }}
          name: Hikari v${{ steps.version.outputs.name }}
          prerelease: ${{ inputs.prerelease || steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Hikari Android client **v${{ steps.version.outputs.name }}** (versionCode ${{ steps.version.outputs.code }}).

            ${{ steps.signing.outputs.enabled == 'true' && 'The APK is signed with the release keystore.' || '> **This APK is unsigned.** Set the `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS` and `ANDROID_KEY_PASSWORD` secrets to publish signed builds.' }}

            Matching server image: `arteficent/hikari-sync-server:${{ steps.version.outputs.name }}`
